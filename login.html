<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pixel Art</title>

  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

  <h1>Pixel Art Editor</h1>

  <form id="login-form">

    <div class="input-group">
      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu email"
        required
      >
    </div>

    <div class="input-group">
      <label>Senha</label>

      <input
        type="password"
        id="password"
        placeholder="Senha de 6 dígitos"
        maxlength="6"
        required
      >
    </div>

    <p id="message"></p>

    <button type="submit">
      Entrar
    </button>

  </form>

</div>

<script src="login.js"></script>


</body>
</html>
