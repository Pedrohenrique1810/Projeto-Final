<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <div class="options">

    <div class="opt-wrapper">

      <div class="slider">
        <label for="width-range">Grid Width</label>
        <input type="range" min="1" max="50" value="20" id="width-range">
        <span id="width-value">20</span>
      </div>

      <div class="slider">
        <label for="height-range">Grid Height</label>
        <input type="range" min="1" max="50" value="20" id="height-range">
        <span id="height-value">20</span>
      </div>

    </div>

    <div class="opt-wrapper">
      <button id="submit-grid">Criar display</button>
      <button id="clear-grid">Limpar display</button>
      <input type="color" id="color-input">
      <button id="erase-btn">Apagar</button>
      <button id="paint-btn">Pintar</button>
    </div>

  </div>

  <div class="container"></div>

</div>

<script src="color.js"></script>

</body>
</html>
